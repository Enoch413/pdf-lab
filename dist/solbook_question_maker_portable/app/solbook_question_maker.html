    function directNormalizeMarkedText(value, type = "") {
      let underlineIndex = 0;
      return removeSpaceBeforeClosingBracket(normalizeBracketChoiceSpacing(normalizeSolbookMarkers(value, type)))
        .replace(/\[([^\[\]]*?\/[^\[\]]*?)\]/g, (_, content) => directPlainBracketChoiceMarker(content))
        .replace(/\[\[boxout:([^:\]]+):([^|\]]*)\|([^\]]*)\]\]/g, (_, label, left, right) => directLabeledBracketChoiceMarker(`(${label})`, left, right))
        .replace(/\[\[u:([\s\S]*?)\]\]/g, (_, text) => {
          const marker = shouldNumberUnderlineMarkers(type)
            ? `${SLOT_MARKERS[underlineIndex] || `(${underlineIndex + 1})`} `
            : "";
          const targetText = cleanUnderlineTargetText(text);
          underlineIndex += 1;
          return `${marker}[[direct-bold-underline:${targetText}]]`;
        })
        .replace(/<[^>]+>/g, "")
        .replace(/&nbsp;/g, " ")
        .replace(/&amp;/g, "&")
        .replace(/&lt;/g, "<")
        .replace(/&gt;/g, ">")
        .replace(/&quot;/g, "\"")
        .replace(/&#39;/g, "'")
        .replace(/\r\n?/g, "\n")
        .replace(/[\s\u00A0\u2000-\u200B\u202F\u205F\u3000]+(?=\])/g, "")
        .trim();
    }

    function directPlainText(value, type = "") {
      return directNormalizeMarkedText(value, type)
        .replace(/\[\[direct-bold-bracket:([\s\S]*?)\]\]/g, (_, text) => `[${removeSpaceBeforeClosingBracket(text)}]`)
        .replace(/\[\[direct-(?:bold|underline|bold-underline):([\s\S]*?)\]\]/g, (_, text) => restoreDirectSafeBrackets(text));
    }

    function directMarkedSegments(value, type = "") {
      const raw = removeSpaceBeforeClosingBracket(value);
      const normalized = (raw.includes("[[direct-")
        ? raw
        : directNormalizeMarkedText(raw, type))
        .replace(/\[\[direct-bold-bracket:([\s\S]*?)\]\]/g, (_, text) => (
          `[[direct-bold:${DIRECT_SAFE_OPEN_BRACKET}${removeSpaceBeforeClosingBracket(text)}${DIRECT_SAFE_CLOSE_BRACKET}]]`
        ));
      const segments = [];
      let lastIndex = 0;
      const pattern = /\[\[direct-(bold|underline|bold-underline):([\s\S]*?)\]\]/g;
      normalized.replace(pattern, (match, kind, text, offset) => {
        if (offset > lastIndex) {
          segments.push({ text: normalized.slice(lastIndex, offset), bold: false, underline: false });
        }
        const segmentText = restoreDirectSafeBrackets(text);
        segments.push({
          text: segmentText,
          bold: kind === "bold" || kind === "bold-underline",
          underline: kind === "underline" || kind === "bold-underline"
        });
        lastIndex = offset + match.length;
        return match;
      });
      if (lastIndex < normalized.length) {
        segments.push({ text: normalized.slice(lastIndex), bold: false, underline: false });
      }
      return segments.length ? segments : [{ text: normalized, bold: false, underline: false }];
    }

    function directLineHeight(fontSize, ratio = 1.5) {
      return fontSize * 0.352778 * ratio;
    }

    function directCharSpaceForStep(fontSize, step) {
      return -(step / 100) * fontSize * 0.352778;
    }

    function directTextWidthWithCharSpace(pdf, text, charSpace = 0) {
      return pdf.getTextWidth(text) + charSpace * Math.max(0, String(text || "").length - 1);
    }

    function getDirectFitCharSpace(pdf, text, width, fontSize) {
      pdf.setFontSize(fontSize);
      if (directTextWidthWithCharSpace(pdf, text, 0) <= width) {
        return { fits: true, charSpace: 0 };
      }
      for (let step = 1; step <= 10; step += 1) {
        const charSpace = directCharSpaceForStep(fontSize, step);
        if (directTextWidthWithCharSpace(pdf, text, charSpace) <= width) {
          return { fits: true, charSpace };
        }
      }
      return { fits: false, charSpace: 0 };
    }

    function getDirectCandidateFit(pdf, text, width, fontSize, options = {}) {
      pdf.setFont(DIRECT_PDF_FONT.family, options.style || "normal");
      pdf.setFontSize(fontSize);
      return {
        fits: directTextWidthWithCharSpace(pdf, text, 0) <= width,
        charSpace: 0
      };
    }

    function directLineTextFromWords(words) {
      return words.map((word) => word.text).join(" ");
    }

    function splitDirectLongWord(pdf, word, width, fontSize, options = {}) {
      options = { ...options, style: word?.bold ? "bold" : (options.style || "normal") };
      const text = String(word?.text || "");
      if (!text || getDirectCandidateFit(pdf, text, width, fontSize, options).fits) {
        return [word];
      }

      const chunks = [];
      let current = "";
      Array.from(text).forEach((char) => {
        const candidate = `${current}${char}`;
        if (!current || getDirectCandidateFit(pdf, candidate, width, fontSize, options).fits) {
          current = candidate;
          return;
        }
        chunks.push({ text: current, bold: Boolean(word.bold), underline: Boolean(word.underline) });
        current = char;
      });
      if (current) {
        chunks.push({ text: current, bold: Boolean(word.bold), underline: Boolean(word.underline) });
      }
      return chunks;
    }

    function directWordsFromMarkedParagraph(paragraph) {
      return directMarkedSegments(paragraph)
        .flatMap((segment) => String(segment.text || "")
          .trim()
          .split(/[ \t\r\n\f\v]+/)
          .filter(Boolean)
          .map((word) => ({ text: word, bold: Boolean(segment.bold), underline: Boolean(segment.underline) })));
    }

    function getDirectWordsWidth(pdf, words, fontSize, style = "normal") {
      pdf.setFontSize(fontSize);
      const width = words.reduce((total, word, index) => {
        pdf.setFont(DIRECT_PDF_FONT.family, word.bold ? "bold" : style);
        return total + pdf.getTextWidth(word.text) + (index < words.length - 1 ? pdf.getTextWidth(" ") : 0);
      }, 0);
      pdf.setFont(DIRECT_PDF_FONT.family, style);
      return width;
    }

    function layoutDirectTextParagraph(pdf, paragraph, width, fontSize, options = {}) {
      const words = directWordsFromMarkedParagraph(paragraph);
      if (!words.length) {
        return [{ text: "", words: [], charSpace: 0, justify: false, style: options.style || "normal", paragraphEnd: true }];
      }

      const lines = [];
      let current = [];
      let currentCharSpace = 0;
      words.flatMap((word) => splitDirectLongWord(pdf, word, width, fontSize, options)).forEach((word) => {
        const candidateWords = current.length ? [...current, word] : [word];
        // Measure the same per-word font faces that drawDirectLine uses.
        const fit = { fits: getDirectWordsWidth(pdf, candidateWords, fontSize, options.style) <= width, charSpace: 0 };
        if (fit.fits) {
          current = candidateWords;
          currentCharSpace = fit.charSpace;
          return;
        }

        if (current.length) {
          lines.push({
            text: directLineTextFromWords(current),
            words: current,
            charSpace: currentCharSpace,
            justify: Boolean(options.justify),
            style: options.style || "normal",
            paragraphEnd: false
          });
        }

        const wordFit = getDirectCandidateFit(pdf, word.text, width, fontSize, { ...options, style: word.bold ? "bold" : options.style });
        current = [word];
        currentCharSpace = wordFit.fits ? wordFit.charSpace : 0;
      });

      if (current.length) {
        lines.push({
          text: directLineTextFromWords(current),
          words: current,
          charSpace: currentCharSpace,
          justify: false,
          style: options.style || "normal",
          paragraphEnd: true
        });
      }
      return lines;
    }

    function directLayoutTextLines(pdf, text, width, fontSize, options = {}) {
      pdf.setFont(DIRECT_PDF_FONT.family, options.style || "normal");
      pdf.setFontSize(fontSize);
      const paragraphs = String(text || "").split("\n");
      const lines = [];
      paragraphs.forEach((paragraph, index) => {
        if (!paragraph.trim()) {
          lines.push({ text: "", words: [], charSpace: 0, justify: false, style: options.style || "normal", paragraphEnd: true });
          return;
        }
        const paragraphLines = layoutDirectTextParagraph(pdf, paragraph, width, fontSize, {
          justify: options.justify !== false,
          fitSpacing: options.fitSpacing === true,
          style: options.style || "normal"
        });
        lines.push(...paragraphLines);
        if (index < paragraphs.length - 1 && paragraphs[index + 1] === "") {
          lines.push({ text: "", words: [], charSpace: 0, justify: false, style: options.style || "normal", paragraphEnd: true });
        }
      });
      return lines;
    }

    function withDirectCharSpace(pdf, charSpace, callback) {
      if (typeof pdf.setCharSpace === "function") {
        pdf.setCharSpace(charSpace || 0);
      }
      try {
        return callback();
      } finally {
        if (typeof pdf.setCharSpace === "function") {
          pdf.setCharSpace(0);
        }
      }
    }

    function drawDirectLine(pdf, line, x, y, width, fontSize) {
      const text = String(line?.text || "");
      const charSpace = line?.charSpace || 0;
      const words = Array.isArray(line?.words) && line.words.length
        ? line.words
        : text.split(/\s+/).filter(Boolean).map((word) => ({ text: word, bold: false, underline: false }));
      const baseStyle = line?.style || "normal";
      const shouldJustify = Boolean(line?.justify) && words.length > 1;
      const drawWord = (word, drawX) => {
        const effectiveStyle = word.bold ? "bold" : baseStyle;
        pdf.setFont(DIRECT_PDF_FONT.family, effectiveStyle);
        const wordWidth = directTextWidthWithCharSpace(pdf, word.text, charSpace);
        withDirectCharSpace(pdf, charSpace, () => {
          pdf.text(word.text, drawX, y, { charSpace });
        });
        if (word.underline) {
          const underlineY = y + fontSize * 0.352778 * 0.14;
          pdf.setDrawColor(...DIRECT_LAYOUT.colors.body);
          pdf.setLineWidth(0.18);
          pdf.line(drawX, underlineY, drawX + wordWidth, underlineY);
        }
      };
      const getWordWidth = (word) => {
        pdf.setFont(DIRECT_PDF_FONT.family, word.bold ? "bold" : baseStyle);
        return directTextWidthWithCharSpace(pdf, word.text, charSpace);
      };
      if (!shouldJustify) {
        let cursorX = x;
        words.forEach((word, index) => {
          drawWord(word, cursorX);
          cursorX += getWordWidth(word);
          if (index < words.length - 1) {
            cursorX += pdf.getTextWidth(" ");
          }
        });
        return;
      }

      const wordWidths = words.map((word) => getWordWidth(word));
      const totalWordWidth = wordWidths.reduce((sum, item) => sum + item, 0);
      const gap = (width - totalWordWidth) / (words.length - 1);
      if (!Number.isFinite(gap) || gap < 0) {
        let cursorX = x;
        words.forEach((word, index) => {
          drawWord(word, cursorX);
          cursorX += wordWidths[index];
          if (index < words.length - 1) {
            cursorX += pdf.getTextWidth(" ");
          }
        });
        return;
      }

      let cursorX = x;
      words.forEach((word, index) => {
        drawWord(word, cursorX);
        cursorX += wordWidths[index] + gap;
      });
      pdf.setFont(DIRECT_PDF_FONT.family, baseStyle);
    }

    function directQuestionBlocks(question, outputNumber) {
      const stem = directPlainText(question.stem || "다음 글을 읽고 물음에 답하시오.", question.type);
      const body = directNormalizeMarkedText(question.body || "", question.type);
      const choices = Array.isArray(question.choices) ? question.choices : [];
      return [
        {
          kind: "text",
          text: `${outputNumber}번 · ${getTypeLabel(question.type)} ${getDifficultyLabel(question.difficulty)}`,
          size: DIRECT_LAYOUT.typography.kicker,
          style: "bold",
          color: DIRECT_LAYOUT.colors.accent,
          fitSpacing: true,
          justify: false,
          gap: DIRECT_LAYOUT.spacing.kickerAfter
        },
        {
          kind: "text",
          text: stem,
          size: DIRECT_LAYOUT.typography.stem,
          style: "bold",
          color: DIRECT_LAYOUT.colors.ink,
          fitSpacing: true,
          gap: DIRECT_LAYOUT.spacing.stemAfter
        },
        {
          kind: "text",
          text: body,
          size: DIRECT_LAYOUT.typography.body,
          style: "normal",
          color: DIRECT_LAYOUT.colors.body,
          fitSpacing: false,
          justify: true,
          gap: choices.length ? DIRECT_LAYOUT.spacing.bodyAfter : 0
        },
        {
          kind: "choices",
          choices: choices.map((choice, index) => ({
            marker: CHOICE_MARKERS[index] || `${index + 1}.`,
            text: directNormalizeMarkedText(normalizeChoiceText(choice, question.type), "")
          })),
          size: DIRECT_LAYOUT.typography.choice,
          color: DIRECT_LAYOUT.colors.choice,
          fitSpacing: true
        }
      ].filter((block) => block.kind !== "choices" || block.choices.length);
    }

    function measureDirectTextBlock(pdf, block, width) {
      if (!block.text) {
        return 0;
      }
      const lines = directLayoutTextLines(pdf, block.text, width, block.size, block);
      return lines.reduce((height, line) => (
        height + (line.text ? directLineHeight(block.size) : directLineHeight(block.size) * 0.55)
      ), 0) + (block.gap || 0);
    }

    function measureDirectChoiceBlock(pdf, block, width) {
      const markerWidth = DIRECT_LAYOUT.spacing.choiceMarkerWidth;
      const markerGap = DIRECT_LAYOUT.spacing.choiceMarkerGap;
      const textWidth = width - markerWidth - markerGap;
      return block.choices.reduce((height, choice, index) => {
        const lines = directLayoutTextLines(pdf, choice.text, textWidth, block.size, {
          style: "normal",
          justify: true,
          fitSpacing: block.fitSpacing !== false
        });
        const lineCount = Math.max(1, lines.length);
        return height
          + lineCount * directLineHeight(block.size)
          + (index < block.choices.length - 1 ? DIRECT_LAYOUT.spacing.choiceItemGap : 0);
      }, 0);
    }

    function measureDirectQuestionCard(pdf, blocks, width) {
      const padding = DIRECT_LAYOUT.card.padding;
      const innerWidth = width - padding * 2;
      return blocks.reduce((height, block) => {
        if (block.kind === "kicker") {
          return height + directLineHeight(block.size) + (block.gap || 0);
        }
        if (block.kind === "choices") {
          return height + measureDirectChoiceBlock(pdf, block, innerWidth);
        }
        return height + measureDirectTextBlock(pdf, block, innerWidth);
      }, padding * 2);
    }

    function drawDirectTextLines(pdf, text, x, y, width, size, options = {}) {
      pdf.setFont(DIRECT_PDF_FONT.family, options.style || "normal");
      pdf.setFontSize(size);
      pdf.setTextColor(...(options.color || DIRECT_LAYOUT.colors.body));
      const lines = directLayoutTextLines(pdf, text, width, size, {
        ...options,
        justify: options.justify !== false
      });
      let cursorY = y;
      lines.forEach((line) => {
        if (!line.text) {
          cursorY += directLineHeight(size) * 0.55;
          return;
        }
        drawDirectLine(pdf, line, x, cursorY, width, size);
        cursorY += directLineHeight(size);
      });
      return cursorY;
    }

    function drawDirectQuestionCard(pdf, x, y, width, blocks) {
      const height = measureDirectQuestionCard(pdf, blocks, width);
      const padding = DIRECT_LAYOUT.card.padding;
      const innerWidth = width - padding * 2;
      let cursorY = y + padding + directLineHeight(DIRECT_LAYOUT.typography.kicker) * 0.72;
      pdf.setDrawColor(...DIRECT_LAYOUT.colors.line);
      pdf.setLineWidth(DIRECT_LAYOUT.card.borderWidth);
      pdf.roundedRect(x, y, width, height, DIRECT_LAYOUT.card.radius, DIRECT_LAYOUT.card.radius, "S");
      blocks.forEach((block) => {
        if (block.kind === "kicker") {
          pdf.setFont(DIRECT_PDF_FONT.family, "bold");
          pdf.setFontSize(block.size);
          pdf.setTextColor(...DIRECT_LAYOUT.colors.accent);
          pdf.text(block.left, x + padding, cursorY);
          pdf.text(block.right, x + width - padding, cursorY, { align: "right" });
          cursorY += directLineHeight(block.size) + (block.gap || 0);
          return;
        }
        if (block.kind === "choices") {
          pdf.setFont(DIRECT_PDF_FONT.family, "normal");
          pdf.setFontSize(block.size);
          pdf.setTextColor(...(block.color || DIRECT_LAYOUT.colors.choice));
          const markerWidth = DIRECT_LAYOUT.spacing.choiceMarkerWidth;
          const markerGap = DIRECT_LAYOUT.spacing.choiceMarkerGap;
          const textWidth = innerWidth - markerWidth - markerGap;
          block.choices.forEach((choice, index) => {
            const lines = directLayoutTextLines(pdf, choice.text, textWidth, block.size, {
              style: "normal",
              justify: true,
              fitSpacing: block.fitSpacing !== false
            });
            const choiceY = cursorY;
            pdf.setFont(DIRECT_PDF_FONT.family, "normal");
            pdf.text(choice.marker, x + padding, choiceY);
            pdf.setFont(DIRECT_PDF_FONT.family, "normal");
            lines.forEach((line, lineIndex) => {
              if (line.text) {
                drawDirectLine(pdf, line, x + padding + markerWidth + markerGap, cursorY, textWidth, block.size);
              }
              cursorY += directLineHeight(block.size);
              if (lineIndex === lines.length - 1 && index < block.choices.length - 1) {
                cursorY += DIRECT_LAYOUT.spacing.choiceItemGap;
              }
            });
            if (!lines.length) {
              cursorY += directLineHeight(block.size);
            }
          });
          return;
        }
        cursorY = drawDirectTextLines(pdf, block.text, x + padding, cursorY, innerWidth, block.size, block);
        cursorY += block.gap || 0;
      });
      return height;
    }

    function addDirectFooter(pdf) {
      const pageNumber = pdf.internal.getCurrentPageInfo().pageNumber;
      pdf.setTextColor(...DIRECT_LAYOUT.colors.body);
      pdf.setFont(DIRECT_PDF_FONT.family, "normal");
      pdf.setFontSize(7.5);
      pdf.text(COPYRIGHT_WARNING, DIRECT_LAYOUT.page.marginX, 290);
      pdf.setFont(DIRECT_PDF_FONT.family, "bold");
      pdf.setFontSize(10);
      pdf.text(String(pageNumber), DIRECT_LAYOUT.page.width - DIRECT_LAYOUT.page.marginX, 290, { align: "right" });
    }

    function fitDirectHeaderLine(pdf, text, width) {
      const cleanText = String(text || "").replace(/\s+/g, " ").trim();
      if (pdf.getTextWidth(cleanText) <= width) return cleanText;
      const chars = Array.from(cleanText);
      let low = 0, high = chars.length;
      while (low < high) {
        const mid = Math.ceil((low + high) / 2);
        if (pdf.getTextWidth(chars.slice(0, mid).join("") + "…") <= width) low = mid;
        else high = mid - 1;
      }
      return chars.slice(0, low).join("") + "…";
    }

    async function drawDirectHeader(pdf, plan) {
      const logo = await getDirectHeaderLogoDataUrl();
      const x = DIRECT_LAYOUT.page.marginX;
      const y = DIRECT_LAYOUT.page.marginTop;
      const lineY = y + DIRECT_LAYOUT.header.logoHeight + DIRECT_LAYOUT.header.paddingBottom;
      const textWidth = DIRECT_LAYOUT.page.width - x * 2 - DIRECT_LAYOUT.header.logoWidth - 5;
      pdf.setFont(DIRECT_PDF_FONT.family, "bold");
      pdf.setTextColor(...DIRECT_LAYOUT.colors.ink);
      pdf.setFontSize(DIRECT_LAYOUT.header.titleSize);
      pdf.text(fitDirectHeaderLine(pdf, plan.title || "통합 문제지", textWidth), x, y + 7.8);
      pdf.setFontSize(DIRECT_LAYOUT.header.subtitleSize);
      pdf.setTextColor(...DIRECT_LAYOUT.colors.muted);
      pdf.text(fitDirectHeaderLine(pdf, plan.subtitle || "", textWidth), x, y + 15.2);
      if (logo) {
        pdf.addImage(
          logo,
          "PNG",
          DIRECT_LAYOUT.page.width - DIRECT_LAYOUT.page.marginX - DIRECT_LAYOUT.header.logoWidth,
          y,
          DIRECT_LAYOUT.header.logoWidth,
          DIRECT_LAYOUT.header.logoHeight,
          undefined,
          "FAST"
        );
      }
      pdf.setDrawColor(...DIRECT_LAYOUT.colors.ink);
      pdf.setLineWidth(DIRECT_LAYOUT.header.lineWidth);
      pdf.line(x, lineY, DIRECT_LAYOUT.page.width - DIRECT_LAYOUT.page.marginX, lineY);
      return lineY + DIRECT_LAYOUT.header.marginBottom;
    }

    function createDirectFlowState(pdf, top, options = {}) {
      const gutter = options.gutter ?? DIRECT_LAYOUT.grid.questionGap;
      const margin = DIRECT_LAYOUT.page.marginX;
      return {
        pdf,
        top,
        nextTop: options.nextTop ?? top,
        y: top,
        column: 0,
        margin,
        gutter,
        bottom: DIRECT_LAYOUT.page.height - DIRECT_LAYOUT.page.marginBottom,
        columnWidth: (DIRECT_LAYOUT.page.width - margin * 2 - gutter) / 2
      };
    }

    function directColumnX(state) {
      return state.margin + state.column * (state.columnWidth + state.gutter);
    }

    function moveDirectFlow(state) {
      if (state.column === 0) {
        state.column = 1;
        state.y = state.top;
        return;
      }
      addDirectFooter(state.pdf);
      state.pdf.addPage();
      state.column = 0;
      state.top = state.nextTop;
      state.y = state.top;
    }

    function ensureDirectSpace(state, height) {
      if (state.y + height <= state.bottom || state.y === state.top) {
        return;
      }
      moveDirectFlow(state);
    }

    function createDirectQuestionPage(top) {
      return {
        top,
        columns: [[], []]
      };
    }

    function spreadDirectColumnIfNeeded(column, bottom) {
      if (column.length !== 2) {
        return;
      }
      column[1].y = Math.max(column[0].y + column[0].height + DIRECT_LAYOUT.card.gapAfter, bottom - column[1].height);
    }

    function buildDirectQuestionPages(pdf, questions, firstPageTop) {
      const gutter = DIRECT_LAYOUT.grid.questionGap;
      const margin = DIRECT_LAYOUT.page.marginX;
      const bottom = DIRECT_LAYOUT.page.height - DIRECT_LAYOUT.page.marginBottom;
      const columnWidth = (DIRECT_LAYOUT.page.width - margin * 2 - gutter) / 2;
      const pages = [createDirectQuestionPage(firstPageTop)];
      let page = pages[0];
      let columnIndex = 0;
      let y = firstPageTop;

      questions.forEach((question, index) => {
        const blocks = directQuestionBlocks(question, index + 1);
        const height = measureDirectQuestionCard(pdf, blocks, columnWidth);
        if (y + height > bottom && y > page.top) {
          spreadDirectColumnIfNeeded(page.columns[columnIndex], bottom);
          columnIndex += 1;
          if (columnIndex > 1) {
            page = createDirectQuestionPage(DIRECT_LAYOUT.page.marginTop);
            pages.push(page);
            columnIndex = 0;
          }
          y = page.top;
        }

        const x = margin + columnIndex * (columnWidth + gutter);
        page.columns[columnIndex].push({ x, y, height, blocks });
        y += height + DIRECT_LAYOUT.card.gapAfter;
      });

      pages.forEach((item) => item.columns.forEach((column) => spreadDirectColumnIfNeeded(column, bottom)));
      return { pages, columnWidth };
    }

    function drawDirectQuestions(pdf, questions, top) {
      const { pages, columnWidth } = buildDirectQuestionPages(pdf, questions, top);
      pages.forEach((page, pageIndex) => {
        if (pageIndex > 0) {
          pdf.addPage();
        }
        page.columns.forEach((column) => {
          column.forEach((item) => {
            drawDirectQuestionCard(pdf, item.x, item.y, columnWidth, item.blocks);
          });
        });
        addDirectFooter(pdf);
      });
      return pages;
    }

    function directAnswerBlocks(question, index) {
      const explanationType = isQuestionType(question.type, "order") ? "" : question.type;
      const explanation = directPlainText(formatExplanationText(question.explanation || "", question), explanationType);
      return [
        {
          kind: "text",
          text: `${index + 1}번 ${question.answer || "-"}`,
          size: DIRECT_LAYOUT.typography.answer,
          style: "bold",
          color: DIRECT_LAYOUT.colors.accent,
          gap: 0.8
        },
        {
          kind: "text",
          text: explanation,
          size: DIRECT_LAYOUT.typography.answer,
          style: "normal",
          color: DIRECT_LAYOUT.colors.body,
          gap: 0
        }
      ].filter((block) => block.text);
    }

    function measureDirectAnswerCard(pdf, blocks, width) {
      const padding = DIRECT_LAYOUT.answerCard.padding;
      const innerWidth = width - padding * 2;
      return blocks.reduce((height, block) => (
        height + measureDirectTextBlock(pdf, block, innerWidth)
      ), padding * 2);
    }

    function drawDirectAnswerCard(pdf, x, y, width, blocks) {
      const height = measureDirectAnswerCard(pdf, blocks, width);
      const padding = DIRECT_LAYOUT.answerCard.padding;
      const innerWidth = width - padding * 2;
      let cursorY = y + padding + directLineHeight(DIRECT_LAYOUT.typography.answer) * 0.72;
      pdf.setDrawColor(...DIRECT_LAYOUT.colors.line);
      pdf.setLineWidth(DIRECT_LAYOUT.answerCard.borderWidth);
      pdf.roundedRect(x, y, width, height, DIRECT_LAYOUT.answerCard.radius, DIRECT_LAYOUT.answerCard.radius, "S");
      blocks.forEach((block) => {
        cursorY = drawDirectTextLines(pdf, block.text, x + padding, cursorY, innerWidth, block.size, block);
        cursorY += block.gap || 0;
      });
      return height;
    }

    function drawDirectAnswers(pdf, questions) {
      pdf.addPage();
      const titleY = DIRECT_LAYOUT.page.marginTop + 5.8;
      pdf.setFont(DIRECT_PDF_FONT.family, "bold");
      pdf.setFontSize(DIRECT_LAYOUT.typography.answerTitle);
      pdf.setTextColor(...DIRECT_LAYOUT.colors.ink);
      pdf.text("정답 및 해설", DIRECT_LAYOUT.page.marginX, titleY);
      const state = createDirectFlowState(
        pdf,
        DIRECT_LAYOUT.page.marginTop
          + directLineHeight(DIRECT_LAYOUT.typography.answerTitle)
          + 16 * DIRECT_PX_TO_MM,
        {
          gutter: DIRECT_LAYOUT.grid.answerGap,
          nextTop: DIRECT_LAYOUT.page.marginTop
        }
      );
      questions.forEach((question, index) => {
        const blocks = directAnswerBlocks(question, index);
        const height = measureDirectAnswerCard(pdf, blocks, state.columnWidth);
        ensureDirectSpace(state, height);
        drawDirectAnswerCard(pdf, directColumnX(state), state.y, state.columnWidth, blocks);
        state.y += height + DIRECT_LAYOUT.answerCard.gapAfter;
      });
      return state;
    }

    async function createDirectPdfBlobForPlan(plan, onPageProgress = null) {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        unit: "mm",
        format: "a4",
        orientation: "portrait",
        compress: true,
        putOnlyUsedFonts: true
      });
      await registerDirectPdfFont(pdf);
      if (onPageProgress) {
        onPageProgress(1, 1);
      }
      const questionTop = await drawDirectHeader(pdf, plan);
      drawDirectQuestions(pdf, plan.questions, questionTop);
      if (plan.includeAnswers !== false) {
        drawDirectAnswers(pdf, plan.questions);
        addDirectFooter(pdf);
      }
      return pdf.output("blob");
    }

    async function createPdfBlobForPlan(plan, onPageProgress = null) {
      const stage = document.createElement("div");
      stage.className = "pdf-export-stage";
      stage.setAttribute("aria-hidden", "true");
      document.body.appendChild(stage);
      try {
        buildPdfPagesForPlan(plan, stage);
        await inlineCanvasSafeImages(stage);
        if (document.fonts?.ready) {
          await document.fonts.ready;
        }
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait", compress: true });
        const pages = Array.from(stage.querySelectorAll(".pdf-page"));
        for (const [index, page] of pages.entries()) {
          if (onPageProgress) {
            onPageProgress(index + 1, pages.length);
          }
          if (index > 0) {
            pdf.addPage();
          }
          const { canvas, image } = await capturePdfPageImage(page);
          pdf.addImage(image, "JPEG", 0, 0, 210, 297, undefined, "FAST");
          pdf.setFontSize(10);
          pdf.setTextColor(0, 0, 0);
          pdf.text(String(index + 1), 105, 290, { align: "center" });
          canvas.width = 0;
          canvas.height = 0;
          await new Promise((resolve) => requestAnimationFrame(resolve));
        }
        return pdf.output("blob");
      } finally {
        stage.remove();
      }
    }

    function triggerDownloadUrl(url, filename) {
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      triggerDownloadUrl(url, filename);
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }

    function showBatchDownloadLink(blob, filename, planCount) {
      clearBatchDownloadUrl();
      const url = URL.createObjectURL(blob);
      state.batchDownloadUrl = url;
      triggerDownloadUrl(url, filename);
      elements.batchZipStatus.textContent = `선택 조건의 시험지 ${planCount}개(답지 포함)를 ZIP으로 만들었습니다. `;
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.textContent = "다운로드가 안 뜨면 여기를 눌러 저장";
      link.style.color = "var(--accent)";
      link.style.fontWeight = "900";
      elements.batchZipStatus.appendChild(link);
    }

    async function generateSinglePdf() {
      if (state.isSingleBusy || state.isBatchBusy) {
        return;
      }
      const questions = getFilteredQuestions();
      if (!questions.length) {
        setBatchStatus("저장할 문항이 없습니다.");
        return;
      }
      if (!window.jspdf?.jsPDF) {
        setBatchStatus("PDF 생성 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.");
        return;
      }
      setSingleBusy(true);
      clearBatchDownloadUrl();
      const title = elements.examTitleInput.value.trim() || "쏠북 문제지";
      const defaultSubtitle = `${state.sourceName || "선택한 JSON"} · ${questions.length}문항`;
      const subtitle = elements.examSubtitleInput.value.trim() || defaultSubtitle;
      const sortLabel = getSortModeLabel();
      const selectionLabel = getSelectionLabel();
      try {
        setBatchStatus(`PDF 저장 중: ${selectionLabel} · ${questions.length}문항`);
        const pdfBlob = await createDirectPdfBlobForPlan({
          title,
          subtitle: `${subtitle} · ${selectionLabel} · ${sortLabel} 정렬`,
          questions,
          includeAnswers: elements.includeAnswerInput.checked
        });
        const filename = `${toSafeFileName(`${title}_${selectionLabel}_${sortLabel}`)}.pdf`;
        downloadBlob(pdfBlob, filename);
        setBatchStatus(`${filename} 저장을 시작했습니다. 선택 조건의 ${questions.length}문항이 포함됩니다.`);
      } catch (error) {
        console.error(error);
        setBatchStatus(error?.message || "PDF 저장 중 오류가 발생했습니다.");
      } finally {
        setSingleBusy(false);
      }
    }

    async function generateBatchZip() {
      if (state.isBatchBusy || state.isSingleBusy) {
        return;
      }
      if (!getFilteredQuestions().length) {
        setBatchStatus("선택 조건에 맞는 문항이 없습니다. 유형과 난이도를 선택해주세요.");
        return;
      }
      const useDirectPdf = elements.fastZipInput?.checked !== false;
      if (!window.JSZip || !window.jspdf?.jsPDF || (!useDirectPdf && !window.html2canvas)) {
        setBatchStatus("PDF/ZIP 생성 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.");
        return;
      }
      if (!useDirectPdf) {
        const shouldContinue = window.confirm("HTML 캡처 방식은 대량 ZIP 생성에서 매우 오래 걸리거나 멈출 수 있습니다. 그래도 진행할까요?");
        if (!shouldContinue) {
          setBatchStatus("ZIP 생성을 취소했습니다. jsPDF 직접 출력 모드를 권장합니다.");
          return;
        }
      }
      setBatchBusy(true);
      clearBatchDownloadUrl();
      try {
        const sortMode = getSelectedSortMode();
        const sortLabel = getSortModeLabel(sortMode);
        const plans = buildBatchExamPlans(sortMode);
        const selectionLabel = getSelectionLabel();
        const zip = new JSZip();
        for (const [index, plan] of plans.entries()) {
          setBatchStatus(`${index + 1}/${plans.length} ${useDirectPdf ? "빠른 직접 출력 중" : "생성 중"}: ${plan.subtitle} · ${plan.questions.length}문항 + 답지`);
          const pdfBlob = useDirectPdf
            ? await createDirectPdfBlobForPlan(plan, (page, totalPages) => {
              setBatchStatus(`${index + 1}/${plans.length} 빠른 직접 출력 중: ${plan.subtitle} · ${page}/${totalPages}쪽 처리`);
            })
            : await createPdfBlobForPlan(plan, (page, totalPages) => {
              setBatchStatus(`${index + 1}/${plans.length} 생성 중: ${plan.subtitle} · ${page}/${totalPages}쪽 변환`);
            });
          zip.file(plan.filename, pdfBlob);
          await new Promise((resolve) => setTimeout(resolve, 0));
        }
        setBatchStatus("ZIP 파일을 묶는 중입니다...");
        const zipBlob = await zip.generateAsync({ type: "blob" }, (metadata) => {
          setBatchStatus(`ZIP 압축 중... ${Math.round(metadata.percent)}%`);
        });
        const title = toSafeFileName(elements.examTitleInput.value.trim() || "통합 문제지");
        showBatchDownloadLink(zipBlob, `${toSafeFileName(`${title}_${selectionLabel}_${sortLabel}`)}_${plans.length}개_시험지.zip`, plans.length);
      } catch (error) {
        console.error(error);
        setBatchStatus(error?.message || "ZIP 생성 중 오류가 발생했습니다.");
      } finally {
        setBatchBusy(false);
      }
    }

    [elements.typeFilterOptions, elements.difficultySelect, elements.sortModeSelect, elements.includeAnswerInput]
      .forEach((element) => element.addEventListener("change", scheduleRenderExam));
    elements.selectAllTypesButton.addEventListener("click", () => selectAllTypes(true));
    elements.clearTypesButton.addEventListener("click", () => selectAllTypes(false));
    elements.examTitleInput.addEventListener("input", () => {
      elements.examTitleInput.dataset.autoTitle = "false";
      updatePreviewHeader();
    });
    elements.examSubtitleInput.addEventListener("input", () => {
      state.subtitleEdited = true;
      updatePreviewHeader();
    });
    elements.resetButton.addEventListener("click", () => {
      elements.difficultySelect.value = "";
      elements.sortModeSelect.value = SORT_MODE_SOURCE;
      selectAllTypes(true);
    });
    elements.printButton.addEventListener("click", generateSinglePdf);
    elements.batchZipButton.addEventListener("click", generateBatchZip);
    elements.jsonFileInput.addEventListener("change", () => {
      loadQuestionsFromFiles(elements.jsonFileInput.files);
    });

    renderExam();
  </script>
</body>
</html>
